services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: claimiq
      POSTGRES_USER: claimiq
      POSTGRES_PASSWORD: claimiq
    ports:
      - "5432:5432"
    volumes:
      - claimiq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimiq"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://claimiq:claimiq@db:5432/claimiq
    ports:
      - "8000:8000"
    volumes:
      - claimiq_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  claimiq_pg:
  claimiq_uploads:
